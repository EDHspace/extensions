name: Validate community extensions

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: extensions-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run build
            - run: npm run typecheck
            - run: npm test
            - run: npm run check
